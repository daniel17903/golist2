openapi: 3.1.0
info:
  title: GoList Sharing API
  version: v1
  description: |
    REST + WebSocket API of the GoList backend (`apps/backend`). There is no bearer auth: callers
    identify themselves with a client-generated `X-Device-Id` UUID, and list access is granted by
    creating the list or by redeeming one of its share tokens. AI assistants connect to the MCP
    endpoint (`/v1/mcp/{key}`) with the secret key of a connector a device created.

    Keep this file in sync with the Fastify routes; `apps/backend/src/openapi-spec.test.ts` fails
    when routes and paths diverge or a contract-test response does not match these schemas.
  license:
    name: GPL-3.0-only
    url: https://www.gnu.org/licenses/gpl-3.0.html
servers:
  - url: https://go-list.app/api
components:
  securitySchemes:
    DeviceId:
      type: apiKey
      in: header
      name: X-Device-Id
      description: Client-generated device UUID, persisted and sent on every request.
  parameters:
    ShareToken:
      name: shareToken
      in: path
      required: true
      schema:
        type: string
        format: uuid
    ListId:
      name: listId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    ItemId:
      name: itemId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    ConnectorId:
      name: connectorId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    ConnectorKey:
      name: key
      in: path
      required: true
      description: The connector's secret key, as returned when the connector was created or its key regenerated.
      schema:
        type: string
    UpdatedAfter:
      name: updatedAfter
      in: query
      required: true
      description: UTC timestamp with a `Z` suffix (offsets such as `+01:00` are rejected with 400).
      schema:
        type: string
        format: date-time
  schemas:
    ErrorResponse:
      type: object
      required: [message]
      properties:
        message:
          type: string
    HealthResponse:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [ok, error]
    ListItem:
      type: object
      required: [id, listId, name, iconName, category, deleted, createdAt, updatedAt]
      properties:
        id:
          type: string
          format: uuid
        listId:
          type: string
          format: uuid
        name:
          type: string
        iconName:
          type: string
          description: Item icon asset name persisted with the item.
        quantityOrUnit:
          type: string
        category:
          type: string
          description: Item category id (derived by the server from the item name when a write omits it).
        deleted:
          type: boolean
        description:
          type: string
          description: 'Todo lists: free-text notes.'
        points:
          type: integer
          minimum: 1
          maximum: 1000
          description: 'Todo lists: effort points used by the stats (unset means 1).'
        completedAt:
          type: string
          format: date-time
          description: 'Todo lists: when the todo was checked off (unset while open).'
        dueDate:
          type: string
          format: date-time
          description: 'Todo lists: due date.'
        assignedTo:
          type: string
          description: 'Todo lists: free-text assignee.'
        recurrence:
          type: string
          description: 'Todo lists: JSON-encoded recurrence rule `{"every":n,"unit":"day|week|month","weekday"?,"anchor":"from_due_date|from_completion"}`.'
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    ListType:
      type: string
      enum: [shopping, todo]
      description: |
        What the list is for. `shopping` lists show the icon grid; `todo` lists show todos with due
        dates, assignees, points and recurrence. Both use the same items (todo fields are optional on
        every item). Lists created without a type are `shopping`.
    ListDocument:
      type: object
      required: [listId, name, listType, items, createdAt, updatedAt]
      properties:
        listId:
          type: string
          format: uuid
        name:
          type: string
        listType:
          $ref: "#/components/schemas/ListType"
        items:
          type: array
          items:
            $ref: "#/components/schemas/ListItem"
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    ListUpsertRequest:
      type: object
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
        listType:
          $ref: "#/components/schemas/ListType"
          description: Omitted keeps the stored type (new lists default to `shopping`).
        updatedAt:
          type: string
          format: date-time
    ListCreateResponse:
      type: object
      required: [listId]
      properties:
        listId:
          type: string
          format: uuid
    ItemUpsertRequest:
      type: object
      required: [name, deleted, updatedAt]
      properties:
        name:
          type: string
          minLength: 1
        iconName:
          type: string
          minLength: 1
          description: Optional item icon asset name. If omitted for creates or name changes, the server derives it from item name and language.
        quantityOrUnit:
          type: string
          minLength: 1
        category:
          type: string
          minLength: 1
          description: Item category id. If omitted for creates or name changes, the server derives it from item name and language.
        language:
          type: string
          enum: [en, de, es]
          description: |
            Language used for server-side category/icon mapping when category or iconName is omitted.
            If omitted too, the server infers it from the other items on the list (falling back to `en`).
        deleted:
          type: boolean
        updatedAt:
          type: string
          format: date-time
        description:
          type: [string, 'null']
          minLength: 1
          description: 'Omitted keeps the stored value, null clears it. Todo lists: free-text notes.'
        points:
          type: [integer, 'null']
          minimum: 1
          maximum: 1000
          description: 'Omitted keeps the stored value, null clears it. Todo lists: effort points used by the stats (unset means 1).'
        completedAt:
          type: [string, 'null']
          format: date-time
          description: 'Omitted keeps the stored value, null clears it. Todo lists: when the todo was checked off (unset while open).'
        dueDate:
          type: [string, 'null']
          format: date-time
          description: 'Omitted keeps the stored value, null clears it. Todo lists: due date.'
        assignedTo:
          type: [string, 'null']
          minLength: 1
          description: 'Omitted keeps the stored value, null clears it. Todo lists: free-text assignee.'
        recurrence:
          type: [string, 'null']
          minLength: 1
          description: 'Omitted keeps the stored value, null clears it. Todo lists: JSON-encoded recurrence rule `{"every":n,"unit":"day|week|month","weekday"?,"anchor":"from_due_date|from_completion"}`.'
    UpdatedItemsResponse:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/ListItem"
    ShareTokenEntry:
      type: object
      required: [tokenId, listId, createdAt]
      properties:
        tokenId:
          type: string
          format: uuid
        listId:
          type: string
          format: uuid
        createdAt:
          type: string
          format: date-time
    ShareTokenCreateResponse:
      allOf:
        - $ref: "#/components/schemas/ShareTokenEntry"
        - type: object
          required: [shareToken]
          properties:
            shareToken:
              type: string
              format: uuid
    ShareTokenRedeemResponse:
      type: object
      required: [listId]
      properties:
        listId:
          type: string
          format: uuid

    Connector:
      type: object
      description: An AI assistant connection (MCP connector) owned by the calling device.
      required: [connectorId, label, includeAllLists, listIds, createdAt]
      additionalProperties: false
      properties:
        connectorId:
          type: string
          format: uuid
        label:
          type: string
          description: Name the user gave the connection, e.g. "Claude".
        includeAllLists:
          type: boolean
          description: The connector reaches every list the owner device can access, including lists added later.
        listIds:
          type: array
          description: The lists the connector reaches when `includeAllLists` is false (empty otherwise).
          items:
            type: string
            format: uuid
        createdAt:
          type: string
          format: date-time
        lastUsedAt:
          type: string
          format: date-time
          description: Last request to the connector's MCP endpoint; missing when it was never used.
    ConnectorUpsertRequest:
      type: object
      required: [label, includeAllLists]
      properties:
        label:
          type: string
          minLength: 1
          maxLength: 60
        includeAllLists:
          type: boolean
        listIds:
          type: array
          description: Lists the calling device can access; ignored when `includeAllLists` is true.
          maxItems: 500
          items:
            type: string
            format: uuid
    ConnectorListResponse:
      type: object
      required: [connectors]
      properties:
        connectors:
          type: array
          items:
            $ref: "#/components/schemas/Connector"
    ConnectorKeyResponse:
      type: object
      required: [key]
      properties:
        key:
          type: string
          description: |
            Secret key for the MCP endpoint (`/v1/mcp/{key}`). Only a hash is stored, so this is the only
            time the key is returned.
    ConnectorCreateResponse:
      allOf:
        - $ref: "#/components/schemas/ConnectorKeyResponse"
        - type: object
          required: [connector]
          properties:
            connector:
              $ref: "#/components/schemas/Connector"

    SyncItemSummary:
      type: object
      required: [itemId, itemHash, updatedAt]
      properties:
        itemId:
          type: string
          format: uuid
        itemHash:
          type: string
        updatedAt:
          type: integer
    SyncItem:
      description: Item state as carried in WebSocket `item_patch` messages (timestamps in epoch milliseconds).
      type: object
      required: [id, listId, name, iconName, category, deleted, createdAt, updatedAt]
      properties:
        id:
          type: string
          format: uuid
        listId:
          type: string
          format: uuid
        name:
          type: string
          minLength: 1
        iconName:
          type: string
          minLength: 1
        quantityOrUnit:
          type: string
          minLength: 1
        category:
          type: string
          minLength: 1
        deleted:
          type: boolean
        description:
          type: string
          minLength: 1
          description: 'Todo lists: free-text notes.'
        points:
          type: integer
          minimum: 1
          maximum: 1000
          description: 'Todo lists: effort points used by the stats (unset means 1).'
        completedAt:
          type: integer
          description: 'Todo lists: when the todo was checked off (unset while open).'
        dueDate:
          type: integer
          description: 'Todo lists: due date.'
        assignedTo:
          type: string
          minLength: 1
          description: 'Todo lists: free-text assignee.'
        recurrence:
          type: string
          minLength: 1
          description: 'Todo lists: JSON-encoded recurrence rule `{"every":n,"unit":"day|week|month","weekday"?,"anchor":"from_due_date|from_completion"}`.'
        createdAt:
          type: integer
        updatedAt:
          type: integer
    WebSocketClientMessage:
      description: Client-to-server websocket sync messages.
      oneOf:
        - type: object
          required: [type, deviceId]
          properties:
            type:
              const: hello
            deviceId:
              type: string
              format: uuid
        - type: object
          required: [type, listId]
          properties:
            type:
              enum: [subscribe_list, unsubscribe_list]
            listId:
              type: string
              format: uuid
        - type: object
          required: [type, listId, digest]
          properties:
            type:
              const: list_digest
            listId:
              type: string
              format: uuid
            digest:
              type: string
        - type: object
          required: [type, listId, summaries]
          properties:
            type:
              const: hash_diff
            listId:
              type: string
              format: uuid
            summaries:
              type: array
              items:
                $ref: "#/components/schemas/SyncItemSummary"
        - type: object
          required: [type, listId, items]
          properties:
            type:
              const: item_patch
            listId:
              type: string
              format: uuid
            items:
              type: array
              items:
                $ref: "#/components/schemas/SyncItem"
        - type: object
          required: [type, listId, name, updatedAt]
          properties:
            type:
              const: list_metadata_patch
            listId:
              type: string
              format: uuid
            name:
              type: string
            listType:
              $ref: "#/components/schemas/ListType"
              description: Omitted keeps the stored type.
            updatedAt:
              type: integer
    WebSocketServerMessage:
      description: Server-to-client websocket sync messages.
      oneOf:
        - type: object
          required: [type]
          properties:
            type:
              const: hello_ack
        - type: object
          required: [type, listId, listName, listType, listUpdatedAt, serverListDigest]
          properties:
            type:
              const: subscribed
            listId:
              type: string
              format: uuid
            listName:
              type: string
            listType:
              $ref: "#/components/schemas/ListType"
            listUpdatedAt:
              type: integer
            serverListDigest:
              type: string
        - type: object
          required: [type, listId, summaries]
          properties:
            type:
              const: hash_diff
            listId:
              type: string
              format: uuid
            summaries:
              type: array
              items:
                $ref: "#/components/schemas/SyncItemSummary"
        - type: object
          required: [type, listId, items]
          properties:
            type:
              const: item_patch
            listId:
              type: string
              format: uuid
            items:
              type: array
              items:
                $ref: "#/components/schemas/SyncItem"
        - type: object
          required: [type, listId, name, listType, updatedAt]
          properties:
            type:
              const: list_metadata_patch
            listId:
              type: string
              format: uuid
            name:
              type: string
            listType:
              $ref: "#/components/schemas/ListType"
            updatedAt:
              type: integer
        - type: object
          required: [type, message]
          properties:
            type:
              const: error
            message:
              type: string
  responses:
    BadRequest:
      description: Malformed path parameter, `X-Device-Id` header, query or body
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Forbidden:
      description: The device has no access to this list (neither created it nor redeemed one of its share tokens)
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    ConnectorNotFound:
      description: The calling device has no connector with this id
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    UnknownConnectorKey:
      description: No connector has this key (never existed, deleted, or the key was regenerated)
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    McpResponse:
      description: |
        MCP Streamable HTTP response: a JSON-RPC message (`application/json`) or a stream of them
        (`text/event-stream`). See https://modelcontextprotocol.io/specification.
      content:
        application/json: {}
        text/event-stream: {}
security:
  - DeviceId: []
paths:
  /health:
    get:
      operationId: getHealth
      security: []
      summary: Health check (also pings the database)
      responses:
        "200":
          description: Backend and database are reachable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
        "503":
          description: Database query failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
  /healthz:
    get:
      operationId: getHealthz
      security: []
      summary: Health check for the deployment platform (same as /health)
      description: Probed by the Coolify deployment health check before a new container receives traffic.
      responses:
        "200":
          description: Backend and database are reachable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
        "503":
          description: Database query failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
  /v1/lists/{listId}:
    parameters:
      - $ref: "#/components/parameters/ListId"
    put:
      operationId: upsertList
      summary: Create a list with a client-generated id, or rename it
      description: |
        Creates the list (the calling device becomes its creator) or renames it. A rename with an
        `updatedAt` older than the stored one is ignored and still answered with 200.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ListUpsertRequest"
      responses:
        "201":
          description: List created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListCreateResponse"
        "200":
          description: Existing list updated (or the write was older than the stored state)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListCreateResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
    get:
      operationId: getList
      summary: Fetch list by list id
      responses:
        "200":
          description: List document
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListDocument"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
    delete:
      operationId: deleteList
      summary: Delete list (creator device only)
      responses:
        "204":
          description: List deleted
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
  /v1/lists/{listId}/items:
    parameters:
      - $ref: "#/components/parameters/ListId"
    get:
      operationId: listItemsUpdatedAfter
      summary: Fetch items updated after timestamp
      parameters:
        - $ref: "#/components/parameters/UpdatedAfter"
      responses:
        "200":
          description: Updated items
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UpdatedItemsResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
  /v1/lists/{listId}/items/{itemId}:
    parameters:
      - $ref: "#/components/parameters/ListId"
      - $ref: "#/components/parameters/ItemId"
    get:
      operationId: getItem
      summary: Fetch item by id
      responses:
        "200":
          description: Item document
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListItem"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: Item not found in this list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    put:
      operationId: upsertItem
      summary: Upsert item in list
      description: Last write wins by `updatedAt`; an older write is ignored and still answered with 204.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ItemUpsertRequest"
      responses:
        "201":
          description: Item created
        "204":
          description: Item updated (or the write was older than the stored state)
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          description: Item id belongs to another list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /v1/ws:
    get:
      operationId: syncWebSocket
      security: []
      summary: WebSocket endpoint for realtime list item synchronization
      description: |
        Upgrades to a websocket connection. Client must send `hello` first, then list-scoped
        subscribe/unsubscribe and digest/hash/item-patch messages as documented in
        `docs/websocket-sync-protocol.md`.
      responses:
        "101":
          description: Switching Protocols (WebSocket upgrade)
        "404":
          description: Not a WebSocket upgrade request
      x-websocket-messages:
        client:
          $ref: "#/components/schemas/WebSocketClientMessage"
        server:
          $ref: "#/components/schemas/WebSocketServerMessage"
  /v1/share-tokens/{shareToken}/redeem:
    parameters:
      - $ref: "#/components/parameters/ShareToken"
    post:
      operationId: redeemShareToken
      summary: Redeem a share token for the requesting device
      description: Grants the device access to the token's list. Redeeming the same token again is allowed.
      responses:
        "200":
          description: Share token redeemed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ShareTokenRedeemResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          description: Unknown share token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /v1/lists/{listId}/share-tokens:
    parameters:
      - $ref: "#/components/parameters/ListId"
    post:
      operationId: createShareToken
      summary: Create an additional share token for a list the device has access to
      responses:
        "201":
          description: Share token created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ShareTokenCreateResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
  /v1/connectors:
    get:
      operationId: listConnectors
      summary: List the AI assistant connections (MCP connectors) of the calling device
      responses:
        "200":
          description: The device's connectors, oldest first
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConnectorListResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
    post:
      operationId: createConnector
      summary: Create an AI assistant connection (MCP connector)
      description: |
        The calling device becomes the connector's owner. The connector gets its own device id and reaches
        the owner's lists (all of them, or the picked ones) through `/v1/mcp/{key}`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ConnectorUpsertRequest"
      responses:
        "201":
          description: Connector created; the response holds its secret key
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConnectorCreateResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          description: A picked list is not accessible to the calling device
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /v1/connectors/{connectorId}:
    parameters:
      - $ref: "#/components/parameters/ConnectorId"
    put:
      operationId: updateConnector
      summary: Rename a connector or change the lists it reaches
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ConnectorUpsertRequest"
      responses:
        "200":
          description: Connector updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Connector"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          description: A picked list is not accessible to the calling device
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          $ref: "#/components/responses/ConnectorNotFound"
    delete:
      operationId: deleteConnector
      summary: Delete a connector; its URL stops working
      responses:
        "204":
          description: Connector deleted
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/ConnectorNotFound"
  /v1/connectors/{connectorId}/key:
    parameters:
      - $ref: "#/components/parameters/ConnectorId"
    post:
      operationId: regenerateConnectorKey
      summary: Replace a connector's secret key; the old URL stops working
      responses:
        "200":
          description: New key
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConnectorKeyResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/ConnectorNotFound"
  /v1/mcp/{key}:
    parameters:
      - $ref: "#/components/parameters/ConnectorKey"
    post:
      operationId: mcpRequest
      security: []
      summary: MCP endpoint for AI assistants (Streamable HTTP, stateless)
      description: |
        Remote MCP server (spec 2026-07-28, plus the stateless 2025 fallback) with tools to read and edit the
        connector's lists. The secret key in the path is the credential, so assistants add the URL as a
        connector without authentication. The tools act as the connector's own device.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: A JSON-RPC 2.0 request or notification.
